[tasks.ssh-local]
description = "Connect to local VM on port $SSH_PORT_LOCAL"
run = '''
    # Connect SSH on port $SSH_PORT_LOCAL...

    echo "waiting for local VM to accept connections..."
    until nc -z localhost "$SSH_PORT_LOCAL"; do sleep 1; done

    # Extracting the remote SSH key with sops
    KEY_PATH=$(mktemp)
    trap 'rm -f "$KEY_PATH"' EXIT
    chmod 600 "$KEY_PATH"
    sops -d --extract '["id_ed25519"]' "$MISE_PROJECT_ROOT/secrets/secrets.enc.yaml" \
        > "$KEY_PATH"

    ssh -o IdentitiesOnly=yes \
        -o UserKnownHostsFile=/dev/null \
        -o StrictHostKeyChecking=no \
        -p "$SSH_PORT_LOCAL" \
        -i "$KEY_PATH" \
        $USER@localhost
'''

[tasks.ssh-remote]
description = "Connect to remote VM"
run = '''
    # Connect SSH...

    # === 1. Input: Get and confirm target IP ===
    while true; do
        if [ -z "$REMOTE_IP4" ]; then
            read -p "🌐 Enter VPS Instance IPv4: " REMOTE_IP4
        fi

        read -p "❓ Target IP is $REMOTE_IP4. Is this correct? (y/n): " confirm
        if [[ "$confirm" =~ ^[Yy]$ ]]; then
            break
        else
            unset REMOTE_IP4
            echo "🔄 Let's try that again..."
        fi
    done

    echo "waiting for remote VM to accept connections..."
    until nc -z $REMOTE_IP4; do sleep 1; done

    KEY_PATH=$(mktemp)
    trap 'rm -f "$KEY_PATH"' EXIT
    chmod 600 "$KEY_PATH"
    sops -d --extract '["id_ed25519"]' "$MISE_PROJECT_ROOT/secrets/secrets.enc.yaml" \
        > "$KEY_PATH"
    ssh -i "$KEY_PATH" \
        -o IdentitiesOnly=yes \
        $USER@$REMOTE_IP4
'''

[tasks.cf-add-dns]
description = "Add a DNS record via cloudflared. You will be prompted for the subdomain."
run = '''
    set -euo pipefail

    # Ensure required environment variables exist
    : "${CF_TUNNEL:?Need to set CF_TUNNEL}"
    : "${DOMAIN:?Need to set DOMAIN}"

    # Prompt user for subdomain
    read -p "Enter subdomain to create (e.g., 'pangolin'): " SUB
    if [ -z "$SUB" ]; then
      echo "❌ Subdomain cannot be empty."
      exit 1
    fi

    FULL_HOST="$SUB.$DOMAIN"
    echo "→ Adding DNS record for $FULL_HOST"

    # Attempt to add DNS, don't fail if it already exists
    if cloudflared tunnel route dns "$CF_TUNNEL" "$FULL_HOST"; then
      echo "✅ DNS record created: $FULL_HOST"
    else
      echo "⚠️ DNS record may already exist for $FULL_HOST"
    fi
'''
